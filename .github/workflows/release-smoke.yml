name: 发布装机验证

# 发布之后，真装一遍。
#
# 面板的所有其他检查都作用于源码；用户拿到的却是发布包，以及 get.sh /
# install.sh / uninstall.sh 这三个从不被测试的脚本。v0.1.0 就是带着
# 单元 ReadWritePaths 缺陷发出去的——CI 全绿，装上去起不来，最后靠人肉
# 端到端才发现。这个作业把那次的发现方式固化下来：每次发布后自动跑一遍
# 用户实际执行的命令，几分钟内知道结果，而不是等用户的服务器告诉我们。
#
# GitHub 的 ubuntu runner 里 systemd 是 PID 1，因此单元能真的启动，
# ProtectSystem=strict / ProtectHome=true 那套沙箱也会真的生效。
on:
  # 主路径：由发布流水线在发布完成后直接调用。
  #
  # 不能只靠 release: published——用 GITHUB_TOKEN 创建的 release 不会触发新的
  # 工作流（GitHub 为防递归的明文限制），而本仓库的 release 正是流水线用该
  # token 发的。实测过：v0.3.0 发布后这个触发器毫无动静。
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  # 手工发布（比如在网页上直接建 release）时仍然有效。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要验证的发布 tag，留空则取 releases/latest'
        required: false
  # 改动本文件时自我验证：冒烟脚本本身没跑过，等于没有。
  push:
    branches: [main]
    paths: ['.github/workflows/release-smoke.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-smoke
  cancel-in-progress: false

jobs:
  # 版本解析独立成一个作业：下面两个验证作业都要用，逻辑只写一遍，
  # 且它们可以并行跑。
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
      self_update_testable: ${{ steps.resolve.outputs.self_update_testable }}
    steps:
      - name: 解析待验证版本与上一版
        id: resolve
        env:
          # workflow_call 与手动触发走 inputs；release 事件给出本次发布的 tag；
          # push 自检两者皆空，退回 releases/latest。
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' "$@"
          }

          version="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -z ${version} ]]; then
            version=$(api "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name')
          fi
          if [[ ! ${version} =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "无法确定要验证的版本（得到 '${version}'）" >&2
            exit 1
          fi

          # 先锚定目标 release 的发布时间，再分页向前找版本号也严格更小的正式版。
          # 不能简单取“最新且不等于目标”：手工回测旧 tag 时那会选到一个更新版本，
          # 把所谓的自升级验证实际跑成降级。
          target_release=$(api \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${version}")
          target_published=$(jq -r '.published_at // empty' <<<"${target_release}")
          if [[ -z ${target_published} ]]; then
            echo "目标 release ${version} 缺少 published_at" >&2
            exit 1
          fi

          version_before() {
            local older=${1} newer=${2}
            local older_major older_minor older_patch newer_major newer_minor newer_patch
            if [[ ${older} =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              older_major=$((10#${BASH_REMATCH[1]}))
              older_minor=$((10#${BASH_REMATCH[2]}))
              older_patch=$((10#${BASH_REMATCH[3]}))
            else
              return 1
            fi
            if [[ ${newer} =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z._-]+)?$ ]]; then
              newer_major=$((10#${BASH_REMATCH[1]}))
              newer_minor=$((10#${BASH_REMATCH[2]}))
              newer_patch=$((10#${BASH_REMATCH[3]}))
            else
              return 1
            fi
            if (( older_major != newer_major )); then
              (( older_major < newer_major ))
              return
            fi
            if (( older_minor != newer_minor )); then
              (( older_minor < newer_minor ))
              return
            fi
            (( older_patch < newer_patch ))
          }

          previous=""
          previous_published=""
          page=1
          while (( page <= 100 )); do
            releases=$(api \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=${page}")
            count=$(jq 'length' <<<"${releases}")
            if (( count == 0 )); then
              break
            fi
            while IFS=$'\t' read -r candidate_published candidate; do
              if version_before "${candidate}" "${version}" &&
                 [[ -z ${previous_published} || ${candidate_published} > ${previous_published} ]]; then
                previous=${candidate}
                previous_published=${candidate_published}
              fi
            done < <(jq -r --arg before "${target_published}" '
              .[] |
              select(.draft == false and .prerelease == false and
                     .published_at != null and .published_at < $before and
                     (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
              [.published_at, .tag_name] | @tsv
            ' <<<"${releases}")
            page=$((page + 1))
          done
          if (( page > 100 )); then
            echo "扫描 100 页 release 后仍无法确定 ${version} 的前驱版本" >&2
            exit 1
          fi

          # 自升级是 v0.3.0 才有的能力，更早的版本没有那个端点，
          # 拿它做起点只会得到一个与被测代码无关的失败。
          testable=false
          if [[ -n ${previous} ]] && ! version_before "${previous}" v0.3.0; then
            testable=true
          fi
          if version_before v0.3.0 "${version}" && [[ ${testable} != true ]]; then
            echo "${version} 应从支持自升级的历史版本开始验证，但没有找到 v0.3.0 及以上的正式前驱" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "previous=${previous}"
            echo "self_update_testable=${testable}"
          } >> "$GITHUB_OUTPUT"
          echo "目标 ${version}；上一版 ${previous:-（无）}；自升级可验证：${testable}"

  # amd64 真机冒烟覆盖不到另外两个发布资产；逐包核对摘要和完整布局，
  # 再用 QEMU 真执行 arm64 / riscv64 二进制，不能只看一个仍可能来自旧包的 ELF 头。
  assets:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.target.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 安装跨架构执行器
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static

      - name: 三架构发布包应完整、可执行且版本正确
        run: |
          workdir=$(mktemp -d)
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"
          base="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o SHA256SUMS "${base}/SHA256SUMS"

          declare -A machines=(
            [amd64]='Advanced Micro Devices X86-64'
            [arm64]='AArch64'
            [riscv64]='RISC-V'
          )
          for arch in amd64 arm64 riscv64; do
            package="kdae-panel_linux_${arch}"
            archive="${package}.tar.gz"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o "${archive}" "${base}/${archive}"
            expected=$(awk -v name="./${archive}" '$2 == name { print $1 }' SHA256SUMS)
            if [[ ! ${expected} =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "SHA256SUMS 里没有 ${archive} 的有效摘要" >&2
              exit 1
            fi
            printf '%s  %s\n' "${expected}" "${archive}" | sha256sum -c -

            extracted="${workdir}/extracted-${arch}"
            mkdir -p "${extracted}"
            tar -xzf "${archive}" -C "${extracted}"
            root="${extracted}/${package}"
            for required in kdae-panel kdae-panel.service kdae-panel.env install.sh uninstall.sh LICENSE README.md; do
              if [[ ! -f ${root}/${required} || -L ${root}/${required} ]]; then
                echo "${archive} 缺少普通文件 ${package}/${required}" >&2
                exit 1
              fi
            done
            for executable in kdae-panel install.sh uninstall.sh; do
              if [[ ! -x ${root}/${executable} ]]; then
                echo "${archive} 内 ${executable} 没有可执行权限" >&2
                exit 1
              fi
            done

            binary="${root}/kdae-panel"
            machine=$(LC_ALL=C readelf -h "${binary}" |
              awk -F: '$1 ~ /^[[:space:]]*Machine$/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            if [[ ${machine} != "${machines[${arch}]}" ]]; then
              echo "${archive} 内 ELF 架构 = '${machine}'，期望 '${machines[${arch}]}'" >&2
              exit 1
            fi
            case ${arch} in
              amd64) reported=$("${binary}" -version) ;;
              arm64) reported=$(qemu-aarch64-static "${binary}" -version) ;;
              riscv64) reported=$(qemu-riscv64-static "${binary}" -version) ;;
            esac
            if [[ ${reported} != "${VERSION}" ]]; then
              echo "${archive} 自报版本 = '${reported}'，期望 '${VERSION}'" >&2
              exit 1
            fi
          done

  smoke:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 安装真实浏览器冒烟依赖
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 走用户真正会执行的那条路径：仓库里的 get.sh 下载并校验发布包，
      # 再由包内的 install.sh 完成安装。预发布不会成为 latest，
      # 因此这里显式传版本，rc 同样能被验证。
      - name: 一键部署
        env:
          KDAE_PANEL_VERSION: ${{ needs.target.outputs.version }}
        run: sudo -E bash scripts/get.sh | tee /tmp/kdae-panel-install-output

      - name: 安装输出应直接给出内网初始化链接
        if: github.event_name != 'push' || github.ref_type != 'branch'
        run: |
          if ! grep -Eq 'http://([0-9]{1,3}\.){3}[0-9]{1,3}:2023/setup#bootstrap=[A-Za-z0-9_-]+' \
            /tmp/kdae-panel-install-output; then
            echo "安装脚本没有直接输出内网初始化链接，完整输出如下：" >&2
            cat /tmp/kdae-panel-install-output >&2
            sudo journalctl -u kdae-panel.service --no-pager -n 50 >&2
            exit 1
          fi
          if grep -q '127\.0\.0\.1:2023/setup#bootstrap=' /tmp/kdae-panel-install-output; then
            echo "安装输出不应在已经检测到内网地址时继续展示回环初始化链接" >&2
            exit 1
          fi
          if grep -q 'journalctl -u kdae-panel' /tmp/kdae-panel-install-output; then
            echo "安装输出不应再要求用户手工查询 journalctl" >&2
            exit 1
          fi

      - name: 首次访问链接应通过私有运行时文件交接
        if: github.event_name != 'push' || github.ref_type != 'branch'
        run: |
          setup_file=/run/kdae-panel/setup-url
          sudo test -s "${setup_file}"
          test "$(sudo stat -c '%a' "${setup_file}")" = 600
          test "$(sudo stat -c '%U:%G' "${setup_file}")" = root:root
          while IFS= read -r setup_url; do
            test -n "${setup_url}"
            grep -Fqx "  ${setup_url}" /tmp/kdae-panel-install-output
          done < <(sudo cat "${setup_file}")

      - name: dae 版本管理应默认可用
        if: github.event_name != 'push' || github.ref_type != 'branch'
        run: |
          sudo grep -qx 'KDAE_PANEL_ENABLE_DAE_INSTALL=true' \
            /etc/kdae-panel/kdae-panel.env
          unit=$(systemctl cat kdae-panel.service)
          read_write_paths=$(grep '^ReadWritePaths=' <<<"${unit}")
          grep -Fq ' /usr/bin ' <<<" ${read_write_paths#ReadWritePaths=} "
          grep -Fq ' /etc/systemd/system ' <<<" ${read_write_paths#ReadWritePaths=} "

      - name: 服务应处于运行状态
        run: |
          # 单元是 Type=notify 还是 simple 都可能有启动延迟，给几秒重试窗口
          for _ in $(seq 1 15); do
            if systemctl is-active --quiet kdae-panel.service; then break; fi
            sleep 1
          done
          systemctl is-active kdae-panel.service
          # 失败时单元状态与近期日志是唯一线索，成功时也留档便于比对
          systemctl status kdae-panel.service --no-pager --full || true
          sudo journalctl -u kdae-panel.service --no-pager -n 50

      - name: 健康接口应返回本次发布的版本
        env:
          EXPECTED: ${{ needs.target.outputs.version }}
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:2023/api/v1/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          # 版本必须与 tag 一致：装上的若是旧包或 dev 构建，这里当场暴露
          got=$(jq -r '.version' /tmp/health.json)
          if [[ ${got} != "${EXPECTED}" ]]; then
            echo "健康接口版本 = ${got}，期望 ${EXPECTED}" >&2
            exit 1
          fi
          test "$(jq -r '.status' /tmp/health.json)" = ok

      - name: 首次初始化链接也应保留在服务日志中
        run: |
          # 日志只用于排障，安装脚本的数据接口是 /run 下的私有文件。
          sudo journalctl -u kdae-panel.service --no-pager |
            tee /tmp/kdae-panel-journal >/dev/null
          grep -q 'setup_url' /tmp/kdae-panel-journal

      - name: 前端资源应可访问
        run: |
          curl -fsS http://127.0.0.1:2023/ -o /tmp/kdae-panel-index.html
          grep -q '<div id="app">' /tmp/kdae-panel-index.html
          # 入口页必须不可缓存，否则升级后用户仍停在旧界面（v0.1.2 修复的问题）
          curl -fsSI http://127.0.0.1:2023/ -o /tmp/kdae-panel-headers
          grep -qi '^cache-control: no-cache' /tmp/kdae-panel-headers

      - name: 发布包内的前端应在真实浏览器中启动
        working-directory: e2e
        env:
          BASE: http://127.0.0.1:2023/
        run: node release-smoke.mjs

      - name: 管理员创建后应删除首次访问链接文件
        if: github.event_name != 'push' || github.ref_type != 'branch'
        env:
          BASE: http://127.0.0.1:2023
        run: |
          setup_url=$(sudo head -n1 /run/kdae-panel/setup-url)
          token=${setup_url##*bootstrap=}
          test -n "${token}"
          curl -fsS -c /tmp/setup-cookie -X POST -H 'Content-Type: application/json' \
            -d "{\"token\":\"${token}\"}" "${BASE}/api/v1/auth/bootstrap"
          curl -fsS -b /tmp/setup-cookie -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-Password-2026"}' \
            "${BASE}/api/v1/auth/setup" >/tmp/setup-session.json
          jq -e '.user.username == "admin"' /tmp/setup-session.json
          sudo test ! -e /run/kdae-panel/setup-url

      - name: 卸载并清除数据
        env:
          # 工作流文件刚推到 main 时 latest 还是旧包，新断言只能由当前检出脚本自证；
          # release 调用会显式传版本，仍然必须验证发布包内的实际副本。
          USE_CHECKOUT_UNINSTALL: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          # 模拟用户通过 systemctl edit 留下的高权限 override，卸载必须一并清掉。
          sudo mkdir -p /etc/systemd/system/kdae-panel.service.d
          printf '[Service]\nReadWritePaths=/usr/bin\n' |
            sudo tee /etc/systemd/system/kdae-panel.service.d/override.conf >/dev/null
          uninstall=/usr/share/kdae-panel/uninstall.sh
          if [[ ${USE_CHECKOUT_UNINSTALL} == true ]]; then
            uninstall=scripts/uninstall.sh
          fi
          echo "卸载脚本：${uninstall}（使用当前检出：${USE_CHECKOUT_UNINSTALL}）"
          sudo KDAE_PANEL_PURGE=true bash "${uninstall}"

      - name: 卸载应清理干净
        run: |
          failures=0
          for leftover in /usr/bin/kdae-panel /etc/systemd/system/kdae-panel.service \
            /etc/systemd/system/kdae-panel.service.d \
            /usr/share/kdae-panel /etc/kdae-panel /var/lib/kdae-panel; do
            # -e 看不到悬空符号链接；卸载验证不能把这种残留当作不存在。
            if [[ -e ${leftover} || -L ${leftover} ]]; then
              echo "::error::卸载后仍残留 ${leftover}"
              sudo ls -lad "${leftover}" || true
              failures=1
            fi
          done
          # 没有匹配单元时 systemctl 会返回非零，这恰好是卸载成功的正常结果；
          # 因此只检查输出里是否仍有单元，不能把退出码本身当成失败。
          systemctl list-unit-files kdae-panel.service > /tmp/kdae-panel-units || true
          cat /tmp/kdae-panel-units
          if grep -q kdae-panel /tmp/kdae-panel-units; then
            echo "::error::systemd 中仍存在 kdae-panel 单元"
            failures=1
          fi
          exit "${failures}"

  # 自升级：一个进程替换掉自己的可执行文件、再让 systemd 把自己重启。
  #
  # 单元测试全程用桩（假下载、假 systemd、假自证），这条路径在真机上一次都
  # 没跑过；而它一旦出错，代价是面板把自己换成一个起不来的二进制。
  # 这里装上一个正式版，打开开关，调真实接口升到本次目标版本。
  self-update:
    needs: target
    if: needs.target.outputs.self_update_testable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: http://127.0.0.1:2023
      PANEL_PASSWORD: smoke-Password-2026
      PREVIOUS: ${{ needs.target.outputs.previous }}
      TARGET: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装上一个正式版作为升级起点
        env:
          KDAE_PANEL_VERSION: ${{ needs.target.outputs.previous }}
        run: sudo -E bash scripts/get.sh

      - name: 起点版本应就位
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS "${BASE}/api/v1/health" >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          got=$(jq -r '.version' /tmp/health.json)
          if [[ ${got} != "${PREVIOUS}" ]]; then
            echo "起点版本 = ${got}，期望 ${PREVIOUS}" >&2
            exit 1
          fi
          # 记下替换前的二进制摘要，升级后用它核对备份确实是"上一版"
          sha256sum /usr/bin/kdae-panel | cut -d' ' -f1 | sudo tee /tmp/before.sha256

      - name: 按文档步骤开启自升级
        run: |
          # v0.3.2 及更早版本的发行单元还没有默认开放 /usr/bin；升级起点可能来自
          # 这些旧版本，因此补一个兼容 drop-in。新安装的发行单元本身已经包含该路径。
          env_file=/etc/kdae-panel/kdae-panel.env
          if sudo grep -q '^KDAE_PANEL_ENABLE_SELF_UPDATE=' "${env_file}"; then
            sudo sed -i 's/^KDAE_PANEL_ENABLE_SELF_UPDATE=.*/KDAE_PANEL_ENABLE_SELF_UPDATE=true/' "${env_file}"
          else
            echo 'KDAE_PANEL_ENABLE_SELF_UPDATE=true' | sudo tee -a "${env_file}"
          fi
          test "$(sudo grep -c '^KDAE_PANEL_ENABLE_SELF_UPDATE=' "${env_file}")" -eq 1
          sudo mkdir -p /etc/systemd/system/kdae-panel.service.d
          printf '[Service]\nReadWritePaths=/usr/bin\n' \
            | sudo tee /etc/systemd/system/kdae-panel.service.d/self-update.conf
          sudo systemctl daemon-reload
          sudo systemctl restart kdae-panel.service
          for _ in $(seq 1 15); do
            if curl -fsS "${BASE}/api/v1/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl is-active kdae-panel.service

      - name: 建立管理员会话
        run: |
          # 升级起点是尚未提供 /run 交接文件的旧正式版，只能从旧版服务日志取链接。
          sudo journalctl -u kdae-panel.service --no-pager |
            tee /tmp/kdae-panel-journal >/dev/null
          token=$(grep -o 'bootstrap=[A-Za-z0-9_-]*' /tmp/kdae-panel-journal |
            tail -n1 | cut -d= -f2)
          test -n "${token}"
          curl -fsS -c /tmp/jar -X POST -H 'Content-Type: application/json' \
            -d "{\"token\":\"${token}\"}" "${BASE}/api/v1/auth/bootstrap"
          curl -fsS -b /tmp/jar -c /tmp/jar -X POST -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"${PANEL_PASSWORD}\"}" \
            "${BASE}/api/v1/auth/setup" > /tmp/session.json
          jq -r '.csrfToken' /tmp/session.json > /tmp/csrf
          test -s /tmp/csrf

      - name: 沙箱下应报告可升级
        run: |
          curl -fsS -b /tmp/jar "${BASE}/api/v1/panel/update" > /tmp/update.json
          jq . /tmp/update.json
          # 这一条检验的是真实沙箱下的可写性探测：ProtectSystem=strict 生效时，
          # 只有那条 ReadWritePaths 真的起作用，它才会是 true
          if [[ $(jq -r '.status.updatable' /tmp/update.json) != true ]]; then
            echo "面板报告不可升级：$(jq -r '.status.problem' /tmp/update.json)" >&2
            exit 1
          fi

      - name: 触发自升级
        run: |
          curl -fsS -b /tmp/jar -X POST \
            -H "X-CSRF-Token: $(cat /tmp/csrf)" -H 'Content-Type: application/json' \
            -d "{\"version\":\"${TARGET}\"}" "${BASE}/api/v1/panel/update"

      - name: 面板应重启为新版本
        run: |
          # 替换、重启、新进程接管都要时间，且期间请求必然失败；
          # 只认"健康接口报出目标版本"这一个成功信号。
          got=""
          for _ in $(seq 1 60); do
            if curl -fsS "${BASE}/api/v1/health" -o /tmp/updated-health.json 2>/dev/null &&
               candidate=$(jq -er '.version' /tmp/updated-health.json 2>/dev/null); then
              got=${candidate}
            else
              got=""
            fi
            if [[ ${got} == "${TARGET}" ]]; then
              echo "已升级到 ${got}"
              exit 0
            fi
            sleep 2
          done
          echo "等待升级超时，最后读到的版本：${got:-（无响应）}" >&2
          systemctl status kdae-panel.service --no-pager --full || true
          sudo journalctl -u kdae-panel.service --no-pager -n 80 >&2
          exit 1

      - name: 磁盘上的二进制与备份都应正确
        run: |
          # 磁盘上的确实是新版本，而不只是进程内存里的
          test "$(sudo /usr/bin/kdae-panel -version)" = "${TARGET}"
          # 自升级没有自动回滚，上一版副本是唯一退路，必须与替换前逐字节一致
          backup=/var/lib/kdae-panel/kdae-panel.previous
          sudo test -f "${backup}"
          if [[ $(sudo sha256sum "${backup}" | cut -d' ' -f1) != $(cat /tmp/before.sha256) ]]; then
            echo "备份内容与替换前的二进制不一致" >&2
            exit 1
          fi
          # 文档给出的还原命令依赖它可执行
          sudo test -x "${backup}"

      - name: 按文档命令回滚后应恢复上一版
        run: |
          rollback=$(sudo mktemp /usr/bin/.kdae-panel-rollback.XXXXXX)
          main_pid=""
          resume_needed=false
          cleanup_rollback() {
            if [[ ${resume_needed} == true && -n ${main_pid} ]]; then
              sudo kill -CONT "${main_pid}" 2>/dev/null || true
            fi
            sudo rm -f "${rollback}"
          }
          trap cleanup_rollback EXIT
          sudo install -m0755 /var/lib/kdae-panel/kdae-panel.previous "${rollback}"
          main_pid=$(systemctl show kdae-panel.service --property=MainPID --value)
          if [[ ! ${main_pid} =~ ^[1-9][0-9]*$ ]]; then
            echo "回滚前没有运行中的面板 MainPID（得到 '${main_pid}'）" >&2
            exit 1
          fi
          running_exe=$(sudo readlink -f "/proc/${main_pid}/exe")
          if [[ ${running_exe} != /usr/bin/kdae-panel ]]; then
            echo "MainPID ${main_pid} 执行的是 ${running_exe}，不是待覆盖的面板二进制" >&2
            exit 1
          fi

          # 固定住正在执行目标文件的进程，证明随后的 mv 确实覆盖了 ETXTBSY 场景，
          # 而不是碰巧在进程已经退出后才成功。
          sudo kill -STOP "${main_pid}"
          resume_needed=true
          state=""
          for _ in $(seq 1 20); do
            state=$(awk '/^State:/ { print $2 }' "/proc/${main_pid}/status")
            if [[ ${state} == T || ${state} == t ]]; then
              break
            fi
            sleep 0.1
          done
          if [[ ${state} != T && ${state} != t ]]; then
            echo "MainPID ${main_pid} 未进入停止态（state=${state}）" >&2
            exit 1
          fi
          sudo mv -f "${rollback}" /usr/bin/kdae-panel
          sudo kill -CONT "${main_pid}"
          resume_needed=false
          trap - EXIT
          sudo systemctl restart kdae-panel.service

          got=""
          for _ in $(seq 1 30); do
            if curl -fsS "${BASE}/api/v1/health" -o /tmp/rollback-health.json 2>/dev/null &&
               candidate=$(jq -er '.version' /tmp/rollback-health.json 2>/dev/null); then
              got=${candidate}
            else
              got=""
            fi
            if [[ ${got} == "${PREVIOUS}" ]]; then
              break
            fi
            sleep 2
          done
          if [[ ${got} != "${PREVIOUS}" ]]; then
            echo "回滚后版本 = '${got:-（无响应）}'，期望 ${PREVIOUS}" >&2
            exit 1
          fi
          test "$(sudo /usr/bin/kdae-panel -version)" = "${PREVIOUS}"

      - name: 升级后仍可正常卸载
        run: |
          # 自升级刻意只替换二进制，/usr/share 下的离线脚本仍属于起点版本；
          # 这里用目标提交里的脚本验证本次发布的卸载逻辑，目标包内副本由 smoke 作业验证。
          sudo KDAE_PANEL_PURGE=true bash scripts/uninstall.sh
          for leftover in /usr/bin/kdae-panel /var/lib/kdae-panel/kdae-panel.previous \
            /etc/systemd/system/kdae-panel.service.d /etc/kdae-panel /var/lib/kdae-panel; do
            if [[ -e ${leftover} ]]; then
              echo "卸载后仍残留 ${leftover}" >&2
              exit 1
            fi
          done
