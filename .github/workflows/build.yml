name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build web UI
        run: make web-build

      - name: Build binary (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o kdae-panel_linux_${{ matrix.arch }} \
            ./cmd/kdae-panel

      - uses: actions/upload-artifact@v4
        with:
          name: kdae-panel_linux_${{ matrix.arch }}
          path: kdae-panel_linux_${{ matrix.arch }}

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Package release assets
        run: |
          for dir in kdae-panel_linux_*; do
            tar -czf "${dir}.tar.gz" -C "$dir" .
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: kdae-panel_linux_*.tar.gz
